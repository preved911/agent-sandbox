# Basic profile example. Place at ./agent-sandbox.yaml in your project.
#
# Usage:
#   agent-sandbox run -e ANTHROPIC_API_KEY=sk-ant-...
#
# Override per-invocation:
#   agent-sandbox run -v ~/otherproject:/workspace --bind 0.0.0.0

docker:
  macos:
    shared_paths_check: true   # validate Docker Desktop shared paths on macOS

# default_profile: basic        # uncomment to skip -p/--profile flag

profiles:
  basic:
    build:
      dockerfile: ./Dockerfile
      context: .
      # Pass version info via build args (env vars expanded from host shell):
      # args:
      #   OPENCODE_VERSION: "${OPENCODE_VERSION}"

    run:
      # opencode-specific container settings.
      entrypoint: ["opencode"]
      command: ["serve", "--hostname=0.0.0.0", "--port=4096"]
      data_dir: /root/.local/share/opencode
      attach: ["opencode", "attach", "%s"]

      env:
        OPENCODE_TELEMETRY: "0"
        # Pass secrets at runtime with -e rather than storing them in config:
        #   agent-sandbox run -e ANTHROPIC_API_KEY=sk-ant-...

      mounts:
        # Bind the project directory you want opencode to work in.
        - source: ~/workspace
          target: /workspace

        # Share your Git identity so commits from inside the container look correct.
        - source: ~/.gitconfig
          target: /root/.gitconfig
          readonly: true

        # Share your SSH keys so git-over-SSH works inside the container.
        - source: ~/.ssh
          target: /root/.ssh
          readonly: true

        # Share host opencode config (read-only) so the container picks up your settings.
        - source: ~/.config/opencode
          target: /root/.config/opencode
          readonly: true

      workdir: /workspace

      port:
        container: 4096/tcp
        # Override at runtime to expose to the LAN:
        #   agent-sandbox run --bind 0.0.0.0
        bind: 127.0.0.1

      firewall:
        default: deny
        cidr:
          allow:
            - 10.0.0.0/8        # private network
            - 172.16.0.0/12     # private network
          deny: []
        dns:
          default: allow
          allow: []
          deny: []
          upstream:
            - 1.1.1.1
            - 8.8.8.8
