# Profiles config. Install at ~/.config/agent-sandbox/config.yaml so that
# `agent-sandbox -p go-dev run` and `agent-sandbox -p node-dev run` work
# from any directory without a project-local agent-sandbox.yaml.
#
# Paths resolve relative to this file, so Dockerfile-go and Dockerfile-node are
# expected to live alongside it.
#
# Usage from any project directory:
#   agent-sandbox -p go-dev run -e ANTHROPIC_API_KEY=sk-ant-...
#
# Override the bound project directory per-invocation:
#   agent-sandbox -p go-dev run -e ANTHROPIC_API_KEY=sk-ant-... -v $PWD:/workspace
#
# Expose to the LAN instead of loopback:
#   agent-sandbox -p go-dev run --bind 0.0.0.0 -e ANTHROPIC_API_KEY=sk-ant-...

docker:
  macos:
    shared_paths_check: true   # validate Docker Desktop shared paths on macOS

default_profile: go-dev

profiles:

  go-dev:
    build:
      dockerfile: ./Dockerfile-go
      context: .
    run:
      entrypoint: ["opencode"]
      command: ["serve", "--hostname=0.0.0.0", "--port=4096"]
      data_dir: /root/.local/share/opencode
      attach_cmd: ["opencode", "attach", "%s"]
      env:
        GOFLAGS: "-mod=mod"
        OPENCODE_TELEMETRY: "0"
      mounts:
        - source: ~/.gitconfig
          target: /root/.gitconfig
          readonly: true
        - source: ~/.ssh
          target: /root/.ssh
          readonly: true
        - source: ~/.config/opencode
          target: /root/.config/opencode
          readonly: true
      workdir: /workspace
      port:
        container: 4096/tcp
        bind: 127.0.0.1
      firewall:
        default: deny
        dns:
          default: allow
          upstream: [1.1.1.1, 8.8.8.8]

  node-dev:
    build:
      dockerfile: ./Dockerfile-node
      context: .
    run:
      entrypoint: ["opencode"]
      command: ["serve", "--hostname=0.0.0.0", "--port=4096"]
      data_dir: /root/.local/share/opencode
      attach_cmd: ["opencode", "attach", "%s"]
      env:
        NODE_ENV: development
        OPENCODE_TELEMETRY: "0"
      mounts:
        - source: ~/.gitconfig
          target: /root/.gitconfig
          readonly: true
        - source: ~/.ssh
          target: /root/.ssh
          readonly: true
        # Reuse the host npm cache so installs inside the container stay fast.
        - source: ~/.npm
          target: /root/.npm
        - source: ~/.config/opencode
          target: /root/.config/opencode
          readonly: true
      workdir: /workspace
      port:
        container: 4096/tcp
        bind: 127.0.0.1
      firewall:
        default: deny
        dns:
          default: allow
          upstream: [1.1.1.1, 8.8.8.8]
